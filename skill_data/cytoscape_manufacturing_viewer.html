ine-color':'#2563eb','target-arrow-color':'#2563eb'}}],layout:{name:'breadthfirst',directed:true,padding:30,spacingFactor:1.25},wheelSensitivity:.18,minZoom:.06,maxZoom:5});
const ds=document.getElementById('ds'),lay=document.getElementById('lay'),el=document.getElementById('el'),details=document.getElementById('details'),status=document.getElementById('status');
function cfg(){let n=lay.value;if(n==='breadthfirst')return{name:n,directed:true,padding:30,spacingFactor:1.25,animate:false};if(n==='cose')return{name:n,padding:30,animate:false,nodeRepulsion:500000,idealEdgeLength:90};return{name:n,padding:30,animate:false}}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function kv(rows){details.innerHTML=rows.map(r=>`<div class="kv"><div class="k">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`).join('')}
function stat(){status.textContent=`${COUNTS[ds.value]} triples · ${cy.nodes().length} nodes · ${cy.edges().length} edges`}
function load(){cy.elements().remove();cy.add(DATA[ds.value]);cy.layout(cfg()).run();setTimeout(()=>cy.fit(undefined,24),30);stat();details.innerHTML='<div class="hint">点击任意节点或边查看完整 URI、RDF 类型、predicate 和 literal datatype。</div>'}
cy.on('tap','node',e=>{let d=e.target.data();kv([['Label',d.label],['Node type',d.type],['Full URI / value',d.full],['RDF types',(d.rdfTypes||[]).join(', ')],['Datatype',d.datatype],['Language',d.language]])});
cy.on('tap','edge',e=>{let d=e.target.data();kv([['Predicate',d.label],['Full predicate URI',d.predicate],['Source',e.target.source().data('full')],['Target',e.target.target().data('full')]])});
ds.addEventListener('change',load);lay.addEventListener('change',()=>{cy.layout(cfg()).run();setTimeout(()=>cy.fit(undefined,24),30)});el.addEventListener('change',()=>cy.style().selector('edge').style('label',el.value==='on'?'data(label)':'').update());document.getElementById('fit').onclick=()=>cy.fit(undefined,24);document.getElementById('reset').onclick=()=>{cy.layout(cfg()).run();setTimeout(()=>cy.fit(undefined,24),30)};stat();setTimeout(()=>cy.fit(undefined,24),100);
